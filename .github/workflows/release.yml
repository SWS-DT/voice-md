name: Release Obsidian plugin

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6

      - name: Validate release tag
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(node -p "require('./manifest.json').version")"
          if [[ "$tag" != "$version" ]]; then
            echo "Release tag $tag does not match manifest version $version."
            exit 1
          fi

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Build and lint plugin
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            styles.css

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          release_args=(--title "$tag" --draft --generate-notes)
          if [[ "$tag" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$tag" "${release_args[@]}" \
            main.js manifest.json styles.css
